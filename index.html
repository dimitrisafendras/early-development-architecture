<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Architecture of Early Development</title>
    <meta
      name="description"
      content="An evidence-based visual infographic mapping the neurobiological foundations, acoustic language scaffolding, tummy-time optimization, and daily caregiver routines of early infant development."
    />

    <!-- PWA.
         Paths here are root-relative and carry NO base prefix: Vite rewrites a
         leading `/` to `base` in both the dev server and the build. Spelling
         `/early-development-architecture/…` out by hand worked in the build and
         silently doubled to `…/early-development-architecture/early-development-architecture/…`
         in dev, which is why the tab icon was missing while developing. It also
         keeps the repo name out of five more places — `vite.config.ts` owns it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#cc3744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Early Dev" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tab icon at the three sizes browsers actually ask for, each rendered
         from the artwork at that size rather than left to the browser to
         downscale from one big file — which is what made the old tab icon
         mush. PNG rather than SVG because the mark *is* an illustration: a
         vector favicon could only ever be an approximation of it. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <!-- Pre-hydration theme bootstrap: apply the persisted (or default dark+rose)
         theme to <html> before React mounts so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var choice = { dark: true, palette: 'red' }
          var raw = localStorage.getItem('eda-theme')
          if (raw) {
            var s = (JSON.parse(raw) || {}).state
            if (s) {
              if (typeof s.dark === 'boolean') choice.dark = s.dark
              if (s.palette === 'blue' || s.palette === 'red') choice.palette = s.palette
            }
          }
          var root = document.documentElement
          root.setAttribute('data-theme', choice.dark ? 'dark' : 'light')
          root.classList.toggle('dark', choice.dark)
          root.setAttribute('data-palette', choice.palette)
          var tc = document.querySelector('meta[name="theme-color"]')
          if (tc) tc.setAttribute('content', choice.dark ? '#0a0a0a' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
